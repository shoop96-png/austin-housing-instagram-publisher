name: Prepare HB24 media

on:
  push:
    paths:
      - '.github/workflows/prepare-hb24-media.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Build fresh accurate JPEG
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          W,H=1080,1350
          img=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(img)
          fb='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          fr='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          navy=(10,41,76); red=(186,32,37); gray=(245,247,249); dark=(25,25,25); gold=(255,198,0)
          F1=ImageFont.truetype(fb,58); F2=ImageFont.truetype(fb,48); Fs=ImageFont.truetype(fr,28); Fb=ImageFont.truetype(fb,31); Fr=ImageFont.truetype(fr,29); Fsmall=ImageFont.truetype(fr,22)
          d.rectangle([0,0,W,230],fill=navy)
          d.text((55,35),'NEIGHBORS JUST LOST',font=F1,fill='white')
          d.text((55,105),'A POWERFUL ZONING TOOL',font=F2,fill=gold)
          d.text((58,175),'Texas HB 24 changed the “valid petition” rule.',font=Fs,fill='white')
          def wrap(text,font,maxw):
              words=text.split(); lines=[]; cur=''
              for w in words:
                  t=(cur+' '+w).strip()
                  if d.textlength(t,font=font)<=maxw: cur=t
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines
          def block(y,title,text,accent):
              d.rounded_rectangle([55,y,W-55,y+245],radius=22,fill=gray,outline=accent,width=4)
              d.text((85,y+30),title,font=Fb,fill=accent)
              yy=y+88
              for line in wrap(text,Fr,W-170):
                  d.text((85,yy),line,font=Fr,fill=dark); yy+=39
          block(280,'OLD RULE','When enough nearby property owners filed a valid petition against a rezoning, City Council needed a supermajority vote to approve it.',navy)
          block(555,'HB 24','A valid petition no longer raises the voting threshold. A simple council majority can approve the rezoning.',red)
          block(830,'SOUTH AUSTIN EXAMPLE','Twenty-nine nearby property owners opposed the proposed 64-unit Rowen Vale project near South Congress. Council approved it unanimously.',navy)
          d.rectangle([0,1115,W,H],fill=navy)
          d.text((55,1148),'WHY IT MATTERS',font=Fb,fill=gold)
          yy=1200
          for line in wrap('Neighbors can still organize and testify, but one of their strongest procedural tools to block or change a rezoning is gone.',Fr,W-110):
              d.text((55,yy),line,font=Fr,fill='white'); yy+=38
          d.text((55,1310),'Source: The Texas Tribune • Aug. 26, 2026',font=Fsmall,fill='white')
          out=Path('media/2026-09-01-hb24-fresh-accurate.jpg')
          img.save(out,'JPEG',quality=88,subsampling=2,optimize=True,progressive=False)
          print(out, out.stat().st_size)
          PY
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/2026-09-01-hb24-fresh-accurate.jpg
          git commit -m "Add fresh HB24 Instagram media"
          git push origin HEAD:main
